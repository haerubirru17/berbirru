name = "berbirru"
main = "src/index.ts"
compatibility_date = "2025-06-01"

workers_dev = true

routes = [
  { pattern = "berbirru.com/*", zone_name = "berbirru.com" },
  { pattern = "www.berbirru.com/*", zone_name = "berbirru.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "berbirru-db"
database_id = "03e44422-b75a-4a7d-8464-41640a5372c8"

[vars]
APP_NAME = "BERBIRRU"
APP_DOMAIN = "berbirru.com"
JWT_SECRET = "berbirru-jwt-secret-key-2026-prod"

[observability]
enabled = true
