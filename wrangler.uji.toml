# ENV UJI — sandbox Pasar Buku. PROD TIDAK TERSANGKUT (tanpa routes, worker sendiri).
# Deploy: npx wrangler deploy --config wrangler.uji.toml
name = "berbirru-uji"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "berbirru-db-uji"
database_id = "743f739f-e59b-492a-baa2-5eb3ea33968d"

# Dedicated sandbox bucket; production binding remains berbirru-media.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "berbirru-media-uji"

[vars]
# Satu-satunya akun yang boleh membuka /owner (putus sengketa + cairkan saldo).
OWNER_EMAIL = "haeru@berbirru.com"
APP_NAME = "BERBIRRU"
APP_DOMAIN = "berbirru-uji.haerubirru17.workers.dev"
KERN_THEME_PRESET = "kern"
# Strix run-4 followup: Pasar Buku ditutup sementara ("1" = gate aktif). Buka: hapus baris ini → deploy.
PASAR_TUTUP = "1"
# Kunci TEST resmi Cloudflare (auto-pass, khusus staging) — bukan widget prod.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
KLIKQRIS_API_URL = "https://klikqris.com/api/sandbox/qris/create"
KLIKQRIS_CALLBACK_URL = "https://berbirru-uji.haerubirru17.workers.dev/api/klikqris/webhook"
# BINDERBYTE_KEY disimpan sebagai Worker Secret, bukan di Git.

[assets]
directory = "./public"

[observability]
enabled = true

# Audit D-03: cron uji NONAKTIF (sebelumnya sweep per jam sandbox ikut menghapus objek dari
# bucket media produksi — jalur hapus terbesar). Sandbox kini memakai bucket dedicated
# berbirru-media-uji; production tetap memakai berbirru-media secara terpisah.
# [triggers]
# crons = ["0 * * * *"]
