<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasar Buku — BERBIRRU</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto+Mono:wght@700&family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #F6F3EB; color: #0B192C;
         min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  .topbar { padding: 14px 18px 8px; }
  .brand { font-family: 'Archivo Black', sans-serif; font-size: 16px; display: inline-block;
           background: #0B192C; color: #FFF9E9; padding: 4px 10px; transform: rotate(-1.5deg); }
  .brand .com { color: #F5C518; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 18px 90px; }
  .card { background: #FFFFFF; border: 3px solid #0B192C; box-shadow: 7px 8px 0 #1E293B;
          padding: 26px 22px 24px; width: 100%; max-width: 330px; text-align: center; }
  .label { font-family: 'Roboto Mono', monospace; font-size: 10px; font-weight: 700;
           letter-spacing: .18em; background: #F5C518; display: inline-block; padding: 3px 10px;
           border: 2px solid #0B192C; margin-bottom: 16px; }
  h1 { font-family: 'Archivo Black', sans-serif; font-size: 24px; line-height: 1.2; margin-bottom: 12px; }
  p { font-size: 14px; font-weight: 500; line-height: 1.55; color: #3D4A5C; margin-bottom: 22px; }
  a.btn { display: block; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 14px;
          background: #1D61E7; color: #fff; border: 2px solid #0B192C; box-shadow: 4px 4px 0 #0B192C;
          padding: 11px 0; text-decoration: none; }
  a.btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .bnav { position: fixed; bottom: 0; left: 0; right: 0; background: #FFFFFF;
          border-top: 2px solid #0B192C; display: flex; justify-content: space-around; padding: 10px 8px 12px; }
  .bnav a { font-size: 10px; font-weight: 800; color: #7A8699; text-decoration: none; }
  .bnav a.on { color: #1D61E7; }
</style>
</head>
<body>
  <div class="topbar"><span class="brand">BERBIRRU<span class="com">.COM</span></span></div>
  <main>
    <div class="card">
      <span class="label">SEGERA</span>
      <h1>Pasar Buku<br>sedang dipersiapkan</h1>
      <p>Fitur <b>jual-beli buku</b> sedang disempurnakan — transaksi lebih aman dan nyaman. Halaman ini akan dibuka segera.</p>
      <a class="btn" href="#">Kembali ke Beranda</a>
    </div>
  </main>
  <nav class="bnav">
    <a href="#">Beranda</a>
    <a class="on" href="#">Pasar</a>
    <a href="#">+</a>
    <a href="#">Notifikasi</a>
    <a href="#">Profil</a>
  </nav>
</body>
</html>
